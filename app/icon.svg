<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C3BFF"/>
      <stop offset="100%" stop-color="#FF3B8B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>
  <!-- TV text — bold, white -->
  <text x="16" y="22" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-0.5">TV</text>
  <!-- Spark / trending dot -->
  <circle cx="26" cy="6" r="3" fill="#FFDF00"/>
  <circle cx="26" cy="6" r="1.5" fill="white"/>
</svg>
