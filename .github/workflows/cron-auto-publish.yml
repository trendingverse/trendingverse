name: Auto Publish (daily cron)

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST — matches original Vercel cron
    - cron: '30 3 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger auto-publish cron
        run: |
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://trendingverse-pages.pages.dev/api/cron/auto-publish")
          echo "HTTP status: $RESPONSE"
          cat /tmp/response.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "Cron endpoint returned non-200 status"
            exit 1
          fi
